{% load static %}
<style>
  .bd-placeholder-img {
    font-size: 1.125rem;
    text-anchor: middle;
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
  }

  @media (min-width: 768px) {
    .bd-placeholder-img-lg {
      font-size: 3.5rem;
    }
  }
</style>

<nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
  <div class="container-lg">
    <a class="navbar-brand" href="/">
      <img src="{% static 'imgs/LogoBaru_90x80.png' %}" alt="" width="75px">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
      aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarCollapse">
      <ul class="navbar-nav me-auto mb-2 mb-md-0">
        <li class="nav-item">
          <a class="nav-link {{ home_page }}" aria-current="page" href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {{ sijil_page }}" href="{% url 'certificateForm' %}">Sijil</a>
        </li>
      </ul>
      {% if request.user.is_authenticated %}
        <div class="dropdown">
          <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            Dropdown
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item {{ profile_page }}" href="{% url 'user_profile' %}">Profile</a></li>
            <li><a class="dropdown-item" href="#">Another action</a></li>
            <li>
              <form class="d-flex" method="POST" action="/admin/logout/">
                {% csrf_token %}
                <button class="dropdown-item" type="submit">Log Out</button>
              </form>
            </li>
          </ul>
        </div>
      {% else %}
      <form class="d-flex">
        <a href="/admin/">
          <button class="btn btn-outline-success" type="button">Login</button>
        </a>
      </form>
      {% endif %}
    </div>
  </div>
</nav>
